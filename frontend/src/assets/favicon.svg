<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Dégradé du fond Dasharr -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090e17" />
    </linearGradient>

    <!-- Dégradé de la lettre D -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#90caf9" />
    </linearGradient>

    <!-- Dégradé du bouton Play cinématique -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Ombre portée pour le relief -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#60a5fa" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Arrière-plan arrondi moderne -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="#334155" stroke-width="12" />

  <!-- Forme principale stylisée du "D" -->
  <path
    d="M 140 110 
       H 270 
       C 370 110, 420 170, 420 256 
       C 420 342, 370 402, 270 402 
       H 140 
       Z"
    fill="none"
    stroke="url(#primaryGrad)"
    stroke-width="52"
    stroke-linejoin="round"
    stroke-linecap="round"
    filter="url(#glow)"
  />

  <!-- Triangle Play cinématique au cœur du D pour le thème Média / Stream / Arr -->
  <polygon
    points="232,196 332,256 232,316"
    fill="url(#playGrad)"
  />
</svg>
